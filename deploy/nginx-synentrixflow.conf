# Synentrix Flow — nginx reverse proxy for synentrixflow.com
# Install: sudo cp deploy/nginx-synentrixflow.conf /etc/nginx/sites-available/synentrixflow
#          sudo ln -sf /etc/nginx/sites-available/synentrixflow /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d synentrixflow.com -d www.synentrixflow.com -d '*.synentrixflow.com'
#          (wildcard cert requires DNS challenge: certbot certonly --manual --preferred-challenges dns ...)

upstream synentrix_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name synentrixflow.com www.synentrixflow.com *.synentrixflow.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name synentrixflow.com www.synentrixflow.com *.synentrixflow.com;

    # Certbot fills these paths after SSL is issued
    ssl_certificate     /etc/letsencrypt/live/synentrixflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synentrixflow.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://synentrix_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
