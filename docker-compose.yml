services:
  mysql:
    image: mysql:8.0
    container_name: leadflow-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: leadflow
      MYSQL_USER: leadflow
      MYSQL_PASSWORD: leadflow
    volumes:
      - leadflow_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uleadflow", "-pleadflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  leadflow_mysql_data:
